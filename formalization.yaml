    authors: ["Idris Ali Shaik"]
    type: "article"
    location: "Unpublished draft v0.8; Theorems A, B, C and Corollaries A1, A2"
    relationship: "formalizes"
    author_endorsement: "participated"
    note: "Source file digest and extracted working-tree inventory are in SOURCE_PROVENANCE.md. No public preprint identifier or novelty claim is asserted."
  - title: "Gallai's Conjecture on Path Decompositions"
    authors: ["Geng-Hua Fan", "Jian-Feng Hou", "Chui-Xiang Zhou"]
    id: "doi:10.1007/s40305-022-00435-3"
    type: "article"
    relationship: "formalizes"
    location: "One-exception endpoint theorem and supporting lemmas"
    author_endorsement: "not-contacted"
  - title: "Towards Gallai's path decomposition conjecture"
    authors: ["Fábio Botler", "Maycon Sambinelli"]
    id: "https://arxiv.org/abs/1911.04546"
    type: "article"
    relationship: "formalizes"
