version: "v0.4"
project:
  name: "Bowtie removal in Gallai path decompositions"
  description: >-
    Structural sufficient conditions for ceiling-budget path decompositions
    of finite simple graphs with whole bowtie components in the induced
    even-degree graph. The selected results include endpoint-preserving
    removal, sharp full-incidence star expansion, composition for a stated
    supported class, and counting corollaries for the two-bowtie kernel.
    The unrestricted two-exception conjecture is not claimed.
  authors:
    - name: "Idris Ali Shaik"
  responsible_maintainers:
    - name: "Idris Ali Shaik"
  license: "Apache-2.0"
sources:
